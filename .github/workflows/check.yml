name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Playwright 1.56.1 provides its Chromium dependencies for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
