<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title description">
  <title id="title">系统原理实验室 · Systems Lab</title>
  <desc id="description">通过 Cache、多级页表和 TCP Reno 三个交互实验，让系统原理在参数与轨迹中变得可见。</desc>
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#577147" stroke-width=".6" opacity=".23"/></pattern>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
      .mono{font-family:"Cascadia Code",Consolas,monospace}
      .muted{fill:#9daf93}
      .lime{fill:#d7ef91}
    </style>
  </defs>
  <rect width="1200" height="640" rx="16" fill="#182522"/>
  <rect width="1200" height="640" rx="16" fill="url(#grid)"/>
  <path d="M64 102H1136M64 588H1136" stroke="#42523a" stroke-width="1"/>
  <g transform="translate(64 45)">
    <rect width="36" height="36" rx="8" fill="#d7ef91"/>
    <path d="M10 10h16v5H15v5h11v5H10z" fill="#182522"/>
    <text x="51" y="24" class="mono" fill="#edf2e5" font-size="19" letter-spacing="2">SYS / LAB</text>
  </g>
  <text x="1136" y="69" text-anchor="end" class="mono muted" font-size="12" letter-spacing="1.3">MEMORY / ADDRESS / NETWORK</text>
  <text x="64" y="199" fill="#f0f4e9" font-size="60" font-weight="700" letter-spacing="-2">系统原理实验室<tspan fill="#d7ef91">。</tspan></text>
  <text x="67" y="248" class="mono lime" font-size="24" letter-spacing="1">Systems Lab</text>
  <text x="67" y="302" class="muted" font-size="20" letter-spacing="1">让系统原理在参数与轨迹中变得可见</text>
  <g transform="translate(862 144)">
    <path d="M0 2h30M0 2v30M273 2h-30M273 2v30M0 157h30M0 157v-30M273 157h-30M273 157v-30" fill="none" stroke="#708655" stroke-width="1.3"/>
    <text x="24" y="45" class="mono muted" font-size="11" letter-spacing="1.1">CHANGE · OBSERVE</text>
    <text x="24" y="89" fill="#d7ef91" font-size="27">亲手运行一次</text>
    <text x="24" y="125" class="mono muted" font-size="13">[ parameters → traces ]</text>
  </g>

  <g transform="translate(64 349)">
    <rect width="344" height="210" rx="10" fill="#22332a" stroke="#485b3d"/>
    <text x="21" y="35" class="mono lime" font-size="13">01</text>
    <text x="21" y="79" fill="#f0f4e9" font-size="28" font-weight="600">Cache 缓存</text>
    <text x="21" y="108" class="muted" font-size="14">命中 · 组相联 · 替换</text>
    <g transform="translate(21 145)">
      <rect width="78" height="35" rx="4" fill="#34492f"/>
      <rect x="111" width="78" height="35" rx="4" fill="#34492f"/>
      <rect x="222" width="78" height="35" rx="4" fill="#d7ef91"/>
      <text x="39" y="23" text-anchor="middle" fill="#bed0aa" font-size="12">地址</text>
      <text x="150" y="23" text-anchor="middle" fill="#bed0aa" font-size="12">映射组</text>
      <text x="261" y="23" text-anchor="middle" fill="#35482a" font-size="12">标签</text>
      <path d="M87 17h15m-4-4 4 4-4 4M198 17h15m-4-4 4 4-4 4" stroke="#91aa74" fill="none" stroke-width="1.2"/>
    </g>
  </g>

  <g transform="translate(428 349)">
    <rect width="344" height="210" rx="10" fill="#22332a" stroke="#485b3d"/>
    <text x="21" y="35" class="mono lime" font-size="13">02</text>
    <text x="21" y="79" fill="#f0f4e9" font-size="28" font-weight="600">多级页表</text>
    <text x="21" y="108" class="muted" font-size="14">索引 · 地址翻译 · 页表占用</text>
    <g transform="translate(21 141)">
      <rect width="54" height="43" rx="3" fill="#34492f"/>
      <rect x="57" width="54" height="43" rx="3" fill="#34492f"/>
      <rect x="114" width="54" height="43" rx="3" fill="#34492f"/>
      <rect x="171" width="54" height="43" rx="3" fill="#34492f"/>
      <rect x="228" width="72" height="43" rx="3" fill="#d7ef91"/>
      <g class="mono" font-size="10" text-anchor="middle" fill="#bdcfaa"><text x="27" y="16">PML4</text><text x="84" y="16">PDPT</text><text x="141" y="16">PD</text><text x="198" y="16">PT</text></g>
      <g class="mono" font-size="11" text-anchor="middle" fill="#edf2e5"><text x="27" y="33">9</text><text x="84" y="33">9</text><text x="141" y="33">9</text><text x="198" y="33">9</text></g>
      <text x="264" y="16" text-anchor="middle" fill="#35482a" class="mono" font-size="9">OFFSET</text>
      <text x="264" y="33" text-anchor="middle" fill="#35482a" class="mono" font-size="11">12</text>
    </g>
  </g>

  <g transform="translate(792 349)">
    <rect width="344" height="210" rx="10" fill="#22332a" stroke="#485b3d"/>
    <text x="21" y="35" class="mono lime" font-size="13">03</text>
    <text x="21" y="79" fill="#f0f4e9" font-size="28" font-weight="600">TCP Reno</text>
    <text x="21" y="108" class="muted" font-size="14">慢启动 · 拥塞避免 · 丢包响应</text>
    <g transform="translate(21 145)">
      <rect width="128" height="35" rx="4" fill="#34492f"/>
      <rect x="172" width="128" height="35" rx="4" fill="#d7ef91"/>
      <text x="64" y="23" text-anchor="middle" fill="#bed0aa" class="mono" font-size="12">cwnd</text>
      <text x="236" y="23" text-anchor="middle" fill="#35482a" class="mono" font-size="12">ssthresh</text>
      <path d="M139 12h22m-4-4 4 4-4 4M161 24h-22m4-4-4 4 4 4" stroke="#91aa74" fill="none" stroke-width="1.2"/>
    </g>
  </g>
  <text x="64" y="615" class="mono muted" font-size="10" letter-spacing="1.1">THREE EXPERIMENTS. ONE WAY TO UNDERSTAND.</text>
  <text x="1136" y="615" text-anchor="end" class="muted" font-size="11">把原理放进实验里。</text>
</svg>
